[project]
name = "dicmerge"
version = "0.5.0"
description = "Scan, merge, and write back custom user dictionaries from multiple Linux applications"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "rich>=15.0.0",
]

[project.scripts]
dicmerge = "dicmerge.cli:main"
version-bump = "dicmerge._version:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
