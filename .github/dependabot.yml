version: 2
updates:
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      runtime:
        patterns:
          - 'PyYAML'
          - 'rich'
      test:
        patterns:
          - 'pytest'
          - 'pytest-cov'
      tooling:
        patterns:
          - 'mypy'
          - 'ruff'
          - 'types-PyYAML'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
