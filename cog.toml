from_latest_tag = true
tag_prefix = "v"
skip_ci = "[skip ci]"

pre_bump_hooks = [
    "sed -i -E 's/^version = \"[^\"]*\"/version = \"{{version}}\"/' pyproject.toml",
    "sed -i -E 's/^__version__ = \"[^\"]*\"/__version__ = \"{{version}}\"/' src/dicmerge/__init__.py",
]

post_bump_hooks = [
    "git push",
    "git push origin v{{version}}",
]

[changelog]
template = "remote"
path = "CHANGELOG.md"
remote = "github.com"
owner = "dcog989"
repository = "dicmerge"
