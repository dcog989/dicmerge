from_latest_tag = true
tag_prefix = "v"
skip_ci = "[skip ci]"

pre_bump_hooks = [
    "uv run ruff check",
    "uv run ruff format --check",
    "uv run mypy src/",
    "uv run pytest",
    "sed -i -E 's/^version = \"[^\"]*\"/version = \"{{version}}\"/' pyproject.toml",
    "sed -i -E 's/^__version__ = \"[^\"]*\"/__version__ = \"{{version}}\"/' src/dicmerge/__init__.py",
    "uv lock",
]

post_bump_hooks = [
    "git push",
    "git push origin v{{version}}",
    "gh release create {{version_tag}} --notes \"$(cog changelog --at {{version_tag}})\"",
]

[changelog]
template = "remote"
path = "CHANGELOG.md"
remote = "github.com"
owner = "dcog989"
repository = "dicmerge"
